<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      BakeryHaven - Homemade Bakery | Fresh Cakes, Cookies & Pastries
    </title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/cookie.png" />

    <meta
      name="description"
      content="BakeryHaven is a local homemade bakery offering fresh cakes, cookies, and pastries baked with love every day. Order your favorite treats today!"
    />
    <meta
      name="keywords"
      content="bakery, homemade cakes, cookies, pastries, local bakery, UMKM bakery, fresh baked goods"
    />
    <meta name="author" content="BakeryHaven" />

    <!-- Open Graph (Removed Lovable images) -->
    <meta property="og:title" content="BakeryHaven - Homemade Bakery" />
    <meta
      property="og:description"
      content="Homemade treats baked fresh every day with love. Cakes, cookies, and pastries made just for you!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/og-image.jpg" />

    <!-- Twitter (Removed Lovable images) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BakeryHaven - Homemade Bakery" />
    <meta
      name="twitter:description"
      content="Fresh homemade cakes, cookies, and pastries baked with love"
    />
    <meta name="twitter:image" content="/images/og-image.jpg" />

    <!-- ✅ Optimize Google Fonts -->
    <!-- 1️⃣ Preload stylesheet (loads asynchronously) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />

    <!-- 2️⃣ Fallback if JS disabled -->
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- 3️⃣ Preconnect optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
